<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>type</title>

    <script>
      // Stamp the saved theme before first paint, otherwise every reload
      // flashes the default theme. Must stay inline and ahead of the bundle.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || 'type';
      } catch {
        document.documentElement.dataset.theme = 'type';
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; margin-top: 50px; font-family: sans-serif; padding: 20px;">
        <h1>this site requires javascript, please enable it.</h1>
      </div>
    </noscript>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
